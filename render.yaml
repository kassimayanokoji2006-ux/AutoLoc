services:
  - type: web
    name: autoloc
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn autoloc.wsgi:application
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autoloc-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: autoloc.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://autoloc.onrender.com
      # No persistent disk: uploads are temporary on the Free filesystem.
databases:
  - name: autoloc-db
    databaseName: autoloc
    user: autoloc
    plan: free
